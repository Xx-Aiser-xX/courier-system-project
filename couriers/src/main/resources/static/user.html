<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Заказ доставки</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Сюда auth.js вставит шапку -->
<div id="mainHeader"></div>

<div class="container" style="max-width: 600px;">

    <div class="card p-4 shadow-sm mb-4 border-0">
        <h4 class="mb-3 text-center">Рассчитать и заказать</h4>

        <div class="mb-3">
            <label class="form-label text-muted small">Откуда</label>
            <input type="text" id="from" class="form-control" placeholder="Адрес отправителя">
        </div>
        <div class="mb-3">
            <label class="form-label text-muted small">Куда</label>
            <input type="text" id="to" class="form-control" placeholder="Адрес получателя">
        </div>
        <div class="mb-4">
            <label class="form-label text-muted small">Вес посылки (кг)</label>
            <input type="number" id="weight" class="form-control" placeholder="1.0" value="1.0">
        </div>

        <!-- Результат цены -->
        <div id="priceResult" class="alert alert-info d-none text-center mb-3">
            Стоимость: <strong id="priceValue">0</strong> RUB
        </div>

        <div class="row g-2">
            <div class="col-6">
                <button onclick="calculatePrice()" class="btn btn-outline-primary w-100">Узнать цену</button>
            </div>
            <div class="col-6">
                <button id="orderBtn" onclick="tryCreateOrder()" class="btn btn-success w-100">Заказать</button>
            </div>
        </div>
    </div>

    <div id="notificationArea" class="d-none">
        <h5 class="mb-3">Статус заказа</h5>
        <div id="notifications" class="list-group"></div>
    </div>
</div>

<script src="js/auth.js"></script>
<script src="js/user.js"></script>
</body>
</html>
