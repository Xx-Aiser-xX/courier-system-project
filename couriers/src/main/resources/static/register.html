<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">

    <div class="card p-4 shadow" style="width: 100%; max-width: 500px;">
        <h3 class="text-center mb-3">Регистрация</h3>

        <ul class="nav nav-tabs mb-3" id="regTabs">
            <li class="nav-item">
                <button class="nav-link active" id="tab-user" data-role="user">Я Клиент</button>
            </li>
            <li class="nav-item">
                <button class="nav-link" id="tab-courier" data-role="courier">Я Курьер</button>
            </li>
        </ul>

        <form id="regForm">
            <div class="mb-3">
                <label>Email (Логин)</label>
                <input type="email" id="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Пароль</label>
                <input type="password" id="password" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Имя</label>
                <input type="text" id="name" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Телефон (11 цифр)</label>
                <input type="text" id="phone" class="form-control" placeholder="79991234567" required pattern="\d{11}">
            </div>

            <div class="mb-3 d-none" id="courierField">
                <label>Способ доставки</label>
                <select id="deliveryMethod" class="form-select">
                    <option value="PEDESTRIAN">Пеший</option>
                    <option value="BICYCLE">Велосипед</option>
                    <option value="CAR">Автомобиль</option>
                </select>
            </div>

            <button type="submit" class="btn btn-success w-100">Зарегистрироваться</button>
        </form>

        <div class="text-center mt-3">
            <a href="index.html">Уже есть аккаунт? Войти</a>
        </div>
    </div>
    <script src="js/auth.js"></script>
    <script src="js/register.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
