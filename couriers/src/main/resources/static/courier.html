<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Кабинет курьера</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .status-panel { padding: 20px; background: white; border-radius: 10px; margin-bottom: 20px; }
        .active-order { border-left: 5px solid #28a745; background: #e8f5e9; }
    </style>
</head>
<body class="bg-light p-4">

    <div class="container" style="max-width: 600px;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Курьер</h2>
            <button onclick="logout()" class="btn btn-outline-danger btn-sm">Выход</button>
        </div>

        <div class="status-panel shadow-sm">
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="workSwitch" onchange="toggleWork()">
                <label class="form-check-label fw-bold" for="workSwitch" id="workStatusLabel">Оффлайн</label>
            </div>
            <small class="text-muted">Включите тумблер, чтобы получать заказы</small>
        </div>

        <div id="activeOrderPanel" class="status-panel active-order shadow-sm d-none">
            <h4>Активный заказ</h4>
            <p><strong>Откуда:</strong> <span id="orderFrom"></span></p>
            <p><strong>Куда:</strong> <span id="orderTo"></span></p>
            <hr>
            <div class="d-grid gap-2">
                <button id="btnPickup" class="btn btn-warning" onclick="changeStatus('IN_TRANSIT')">Забрал товар</button>
                <button id="btnDeliver" class="btn btn-success d-none" onclick="changeStatus('DELIVERED')">Вручил клиенту</button>
            </div>
        </div>

        <div id="logArea" class="text-muted small mt-3"></div>
    </div>

    <div class="modal fade" id="offerModal" data-bs-backdrop="static" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Новый заказ</h5>
                </div>
                <div class="modal-body text-center">
                    <h3>Заказ #<span id="offerOrderIdShort"></span></h3>
                    <p>У вас есть <strong id="timer" class="text-danger" style="font-size: 1.5em;">30</strong> сек</p>
                </div>
                <div class="modal-footer justify-content-center">
                    <button type="button" class="btn btn-secondary" onclick="declineOrder()">Отказаться</button>
                    <button type="button" class="btn btn-success btn-lg" onclick="acceptOrder()">Принять</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/courier.js"></script>
</body>
</html>
