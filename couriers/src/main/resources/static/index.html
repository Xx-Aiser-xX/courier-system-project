<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход в систему</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .login-card { width: 100%; max-width: 400px; padding: 20px; border-radius: 10px; background: white; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div id="mainHeader"></div>
    <div class="container d-flex flex-column align-items-center justify-content-center" style="min-height: 80vh;">
        <div class="login-card">
            <h3 class="text-center mb-4">Вход</h3>
            <div class="mb-3">
                <label>Логин (Email)</label>
                <input type="text" id="username" class="form-control" placeholder="user@mail.ru">
            </div>
            <div class="mb-3">
                <label>Пароль</label>
                <input type="password" id="password" class="form-control" placeholder="***">
            </div>
            <button onclick="handleLogin()" class="btn btn-primary w-100 mb-3">Войти</button>
            <div class="text-center">
                <a href="register.html" class="text-decoration-none">Нет аккаунта? Зарегистрироваться</a>
            </div>
        </div>
    </div>
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
